name: .NET 10 Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Source/Acose.CustomerManager.csproj

    - name: Build Application (Release)
      run: dotnet build Source/Acose.CustomerManager.csproj --configuration Release --no-restore
